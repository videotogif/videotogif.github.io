<!-- _includes/comments.html -->
{%- assign c_en = false -%}{%- if page.lang contains "en" -%}{%- assign c_en = true -%}{%- endif %}
<section id="comments" class="comments-section">
    <div class="comments-header">
        <h2>💬 {% if c_en %}Comments{% else %}댓글{% endif %}</h2>
        <p class="comments-description">{% if c_en %}Questions or feedback are always welcome. (Sign in with GitHub to comment.){% else %}자유롭게 의견을 나눠주세요{% endif %}</p>
    </div>

    <div class="comments-container" id="giscusBox" data-lang="{% if c_en %}en{% else %}ko{% endif %}"></div>
    <script>
        // Giscus 댓글: 사이트 테마(밝게/어둡게)에 맞춘 전용 테마 파일로 불러옴(안쪽 간격을 줄인 버전)
        function giscusTheme() {
            var dark = document.documentElement.classList.contains('dark-mode');
            return 'https://videotogif.github.io/assets/css/giscus-' + (dark ? 'dark' : 'light') + '.css?v=2';
        }
        (function () {
            var box = document.getElementById('giscusBox');
            var s = document.createElement('script');
            var attrs = {
                'data-repo': 'videotogif/videotogif.github.io',
                'data-repo-id': 'R_kgDOQHyumg',
                'data-category': 'Announcements',
                'data-category-id': 'DIC_kwDOQHyums4CxKIE',
                'data-mapping': 'pathname',
                'data-strict': '0',
                'data-reactions-enabled': '1',
                'data-emit-metadata': '0',
                'data-input-position': 'top',
                'data-theme': giscusTheme(),
                'data-lang': box.dataset.lang,
                'data-loading': 'lazy'
            };
            Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
            s.src = 'https://giscus.app/client.js';
            s.crossOrigin = 'anonymous';
            s.async = true;
            box.appendChild(s);
        })();
    </script>

    <style>
        .comments-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 2px solid #e5e7eb;
        }

        .dark-mode .comments-section {
            border-top-color: #374151;
        }

        .comments-header {
            margin-bottom: 16px;
            text-align: center;
        }

        .comments-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px;
        }

        .dark-mode .comments-header h2 {
            color: #f9fafb;
        }

        .comments-description {
            color: #6b7280;
            font-size: 0.95rem;
            margin: 0;
        }

        .dark-mode .comments-description {
            color: #9ca3af;
        }

        .comments-container {
            max-width: 100%;
        }

        /* Giscus 테마 전환 스크립트 */
        .giscus-frame {
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .comments-section {
                margin-top: 24px;
                padding-top: 20px;
            }

            .comments-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>

    <script>
        // 다크모드 토글 시 Giscus 테마 변경
        function updateGiscusTheme() {
            const theme = giscusTheme();

            const iframe = document.querySelector('iframe.giscus-frame');
            if (iframe) {
                iframe.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: theme } } },
                    'https://giscus.app'
                );
            }
        }

        // MutationObserver로 다크모드 변경 감지
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    updateGiscusTheme();
                }
            });
        });

        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class']
        });
    </script>
</section>
