title: "Video to GIF"
description: "온라인에서 무료 GIF 만들기. 서버에 파일이 저장되지 않아 안전하고, 빠릅니다. 걱정 없이 안전하게 로컬에서 동영상 파일을 업로드하여 빠르게 GIF로 변환하세요."
url: "https://videotogif.github.io"
baseurl: ""

timezone: Asia/Seoul
lang: ko-KR # HTML lang
locale: ko_KR # Open Graph/og:locale 용

# 링크 형태 정규화
permalink: pretty

# 블로그 페이지네이션
paginate: 9
paginate_path: "/blog/page:num/"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# 기본값 (front matter 없을 때)
defaults:
  - scope: { path: "" }
    values:
      layout: page
      lang: ko-KR
      robots: index,follow
      image: /assets/img/og-default.jpg
  - scope: { path: "_posts" }
    values:
      layout: post
      is_blog: true
      robots: index,follow
      image: /assets/img/og-default.jpg
      comments: true

# 소유권/광고
google_site_verification: lDRyRzphsuydZUsLl0VDnAcf1qpxkQ7R9yvMWRSdCnk
naver_site_verification: 5bc446ed2588d2bddf6cac7b09788dc0e87bc67f
adsense_client: ca-pub-1404060643961114

# 수동 광고 단위 (선택). AdSense > 광고 > 광고 단위 기준 > 디스플레이 광고 생성 후
# 나오는 data-ad-slot 숫자를 따옴표로 넣으세요. 비워두면 자동 광고만 동작합니다.
adsense_slots:
  home: ""   # 메인(한/영) 변환기 아래
  post: ""   # 블로그 글 본문 아래

# 로고/소셜 (가능하면 절대경로로)
logo: https://videotogif.github.io/favicon.png

# 키워드(참고용). jekyll-seo-tag는 description/제목/본문 발췌를 더 신뢰.
keywords: "동영상 gif 변환, 영상 gif 만들기, mp4 gif 변환, 온라인 gif 툴, gif 변환 사이트"

# 소셜 계정
social:
  name: "Video to GIF"
  links:
    - https://github.com/videotogif
    - https://videotogif.github.io

# 빌드 제외
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - vite.config.js
  - PROJECT_SPECIFICATION.md
  # gifski 라이브러리 문서가 페이지로 렌더링되어 sitemap에 노출되는 것 방지
  - assets/wasm/gifski-wasm/README.md
  - assets/wasm/gifski-wasm/CHANGELOG.md

# WASM 파일 지원
include:
  - "*.wasm"

# WebAssembly MIME type
webrick:
  headers:
    Access-Control-Allow-Origin: "*"
