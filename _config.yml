title: "Video to GIF"
description: "해킹 걱정 없이 안전하게 온라인에서 GIF 만들기. Convert videos to high-quality GIF directly in your browser."
url: "https://videotogif.github.io"
baseurl: ""

timezone: Asia/Seoul
lang: ko-KR

# 블로그 목록 페이지네이션 (blog.html에서 paginator 사용)
paginate: 10
paginate_path: "/blog/page:num/"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: rss.xml

# 기본값 (front matter 없을 때)
defaults:
  - scope: { path: "" }
    values:
      layout: page
      lang: ko-KR
      robots: index,follow
  - scope: { path: "_posts" }
    values:
      layout: page
      is_blog: true

google_site_verification: lDRyRzphsuydZUsLl0VDnAcf1qpxkQ7R9yvMWRSdCnk
naver_site_verification: 5bc446ed2588d2bddf6cac7b09788dc0e87bc67f
adsense_client: ca-pub-1404060643961114

# SEO 보조 정보 (jekyll-seo-tag가 일부 활용)
logo: /favicon.png
keywords: "video to gif, 비디오 gif 변환, 동영상 gif, gif 만들기, 로컬 gif converter"

social:
  name: "Video to GIF"
  links:
    - https://github.com/videotogif
    - https://videotogif.github.io

# 피드 (선택)
feed:
  path: feed.xml

# 빌드 제외
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - vite.config.js
