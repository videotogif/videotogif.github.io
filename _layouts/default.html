<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="google-site-verification" content="lDRyRzphsuydZUsLl0VDnAcf1qpxkQ7R9yvMWRSdCnk" />
    <meta name="google-adsense-account" content="ca-pub-1404060643961114">
    <meta name="naver-site-verification" content="5bc446ed2588d2bddf6cac7b09788dc0e87bc67f" />

    <title>{{ page.title }} {{ site.title }}</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    {% include head.html %}

    <link rel="stylesheet" href="{{ '/assets/build/css/style.css' | relative_url }}">
    <script type="module" src="{{ '/assets/build/js/main.js' | relative_url }}"></script>

    <!-- Theme init: run before paint -->
    <script>
        (function () {
            var KEY = 'zif-theme'; // 'dark' | 'light' | null(=시스템 추종)
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) { }
            var prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = saved ? (saved === 'dark') : prefersDark;
            if (isDark) document.documentElement.classList.add('dark-mode');
        })();
    </script>
</head>

<body>
    <!-- 헤더 -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="{{ '/' | relative_url }}">
                    <h1>Video to GIF</h1>
                </a>
            </div>

            <!-- 햄버거 메뉴 버튼 (모바일) -->
            <button class="hamburger-menu" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="main-nav">
                <ul>
                    <li><a href="{{ '/' | relative_url }}">Video to GIF</a></li>
                    <li><a href="{{ '/about/' | relative_url }}">About</a></li>
                    <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
                    <!-- <li><a href="{{ '/privacy/' | relative_url }}">Privacy</a></li> -->
                </ul>
            </nav>
        </div>
    </header>

    <!-- 페이지 본문 -->
    <main class="site-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-content">
                <p>© 2025 Video to GIF Converter. All rights reserved.</p>
                <button class="dark-mode-toggle" aria-label="Toggle dark mode">
                    <span>Dark</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- 푸터 아래 한 번만 로드 -->
    <script src="{{ '/darkmode-toggle.js' | relative_url }}"></script>

</body>

</html>
